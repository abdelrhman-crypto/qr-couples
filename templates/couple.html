<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif;
            {% if data.bg_type == 'image' and data.bg_image_url %}
                background: url('{{ data.bg_image_url }}') no-repeat center center fixed;
                background-size: cover;
            {% else %}
                background-color: {{ data.bg_color }};
            {% endif %}
        }
    </style>
</head>
<body class="min-h-screen pt-8 pb-12 text-gray-800">

    <!-- مشغل الموسيقى (مخفي كلياً ويشتغل تلقائياً عند أول لمسة) -->
    {% if data.song_url %}
        <audio id="bgMusic" loop preload="auto" style="display: none;">
            <source src="{{ data.song_url }}" type="audio/mpeg">
        </audio>
    {% endif %}

    <!-- عرض الصور والفيديوهات والنصوص -->
    <main class="max-w-md mx-auto px-4 space-y-8">
        {% for moment in data.moments %}
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl overflow-hidden shadow-xl border border-gray-100">
            
            {% if moment.is_video %}
                <video controls class="w-full h-80 object-cover bg-black">
                    <source src="{{ moment.url }}">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            {% else %}
                <img src="{{ moment.url }}" class="w-full h-80 object-cover">
            {% endif %}

            <div class="p-6 text-center">
                <p class="text-lg font-semibold leading-relaxed text-gray-800">{{ moment.text }}</p>
            </div>
        </div>
        {% endfor %}
    </main>

    <script>
        // تشغيل الموسيقى فور تفاعل المستخدم مع الصفحة
        function playAudio() {
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().catch(function(error) {
                    console.log("Autoplay blocked by browser:", error);
                });
            }
        }

        // الاستماع لأول ضغطة أو لمسة على الشاشة
        document.addEventListener('click', playAudio, { once: true });
        document.addEventListener('touchstart', playAudio, { once: true });
    </script>
</body>
</html>
